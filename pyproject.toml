[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ganesh-mini"
version = "0.0.0"
description = "Reproducible training and evaluation tooling for ganesh-mini-1.0"
requires-python = ">=3.12,<3.14"
dependencies = []

[project.scripts]
ganesh-gate0 = "scripts.model.gate0:main"
ganesh-seed-import = "scripts.data.import_ganesh_v01_seed:main"
ganesh-eval-run = "scripts.eval.run_task:main"
ganesh-eval-score = "scripts.eval.score:main"

[project.optional-dependencies]
# Candidate Gate 0 matrix. These bounds are not a compatibility claim; Gate 0
# remains closed until an exact environment is locked and the smoke suite passes.
train-candidate = [
  "torch>=2.7,<3",
  "transformers>=5.9,<6",
  "peft>=0.18,<0.21",
  "ms-swift>=4.5,<5",
  "qwen-vl-utils>=0.0.14,<0.1",
  "flash-linear-attention[cuda]>=0.4.2,<0.6; platform_system == 'Linux'",
  "causal-conv1d>=1.5,<2",
  "bitsandbytes>=0.46,<0.50; platform_system == 'Linux'",
  "torchvision>=0.28,<0.29; platform_system == 'Linux'",
]
test = ["pytest>=8.3,<9"]
# Apple Silicon qualification deliberately excludes CUDA-only acceleration
# packages.  It proves checkpoint compatibility and LoRA mechanics, not the
# production QLoRA/CUDA matrix used for the main run.
gate0-apple = [
  "accelerate>=1.14,<2",
  "huggingface-hub>=1.28,<2",
  "peft>=0.18,<0.21",
  "safetensors>=0.7,<1",
  "torch>=2.7,<3",
  "transformers>=5.9,<6",
]

[tool.hatch.build]
packages = ["scripts"]
include = ["configs", "schemas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
