name: Gate 1 runtime integrity

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-runtime-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Install Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install test tooling
        run: python -m pip install 'pytest>=8.3,<9' 'uv>=0.8,<0.9'

      - name: Restore exact sealed verifier archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/eval/verifier-images/amd64-v1
          gh release download verifier-images-amd64-v1 \
            --repo "${{ github.repository }}" \
            --pattern verifier-images-amd64-v1.tar \
            --dir artifacts/eval/verifier-images/amd64-v1

      - name: Rebuild deterministic VM workspaces
        run: |
          python scripts/eval/package_workspace.py \
            --root . \
            --archive artifacts/eval/workspaces/development-v1.tar.gz \
            --manifest measurement/gate1/development_workspace_20260823.json
          python scripts/train/package_workspace.py \
            --root . \
            --archive artifacts/train/workspaces/seed-pilot-v1.tar.gz \
            --manifest measurement/gate1/training_workspace_20260825.json
          python scripts/inference/verify_gate1_runtime_bundle.py \
            --output measurement/gate1/runtime_bundle_rehearsal.json
          python scripts/inference/build_gate1_gcloud_preparation.py
          git diff --exit-code -- \
            artifacts/eval/workspaces/development-v1.tar.gz \
            measurement/gate1/development_workspace_20260823.json \
            measurement/gate1/training_workspace_20260825.json \
            measurement/gate1/runtime_bundle_rehearsal.json \
            measurement/gate1/gcloud/preparation.json

      - name: Verify repository and sealed VM runtime bundle
        run: |
          python -m pytest
          python scripts/inference/verify_gate1_runtime_bundle.py
